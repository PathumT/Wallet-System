<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check Balance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>Check Balance</header>

  <div class="form-container">
    <select id="balanceUserId">
      <option value="">Select User</option>
    </select>

    <button onclick="checkUserBalance()">SELECT</button>

    <div style="margin-top:20px;">
      <label for="userBalance">Balance:</label>
      <input type="text" id="userBalance" readonly style="margin-left: 10px;">
    </div>

    <h3 style="text-align:center; margin-top: 30px;">Transactions</h3>

    <table id="transactionsTable" border="1" style="width:100%; margin-top:10px;">
      <thead>
        <tr>
          <th>#</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody>
        <!-- Transactions will be loaded here -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
  <script>
    loadUsers('balanceUserId');
  </script>
</body>
</html>
