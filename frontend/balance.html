<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check Balance | Wallet System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/balance.css">
</head>
<body>
  <header>
    <div class="header-content">
      <i class="fas fa-coins header-icon"></i>
      Check Balance
    </div>
  </header>

  <div class="form-container">
    <div class="form-title">
      <i class="fas fa-wallet"></i>
      Account Balance
    </div>
    
    <div class="input-group">
      <label for="balanceUserId">Select Account</label>
      <i class="fas fa-user"></i>
      <select id="balanceUserId">
        <option value="">Select User</option>
      </select>
    </div>
    
    <button onclick="checkUserBalance()">View Balance <i class="fas fa-chevron-right"></i></button>
    
    <div class="balance-container">
      <div class="balance-icon">
        <i class="fas fa-dollar-sign"></i>
      </div>
      <div class="balance-info">
        <div class="balance-label">Current Balance:</div>
        <input type="text" id="userBalance" readonly value="$0.00">
      </div>
    </div>
    
    <div class="transactions-section">
      <div class="section-title">
        <i class="fas fa-exchange-alt"></i>
        Transaction History
      </div>
      
      <table id="transactionsTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          <!-- Transactions will be loaded here -->
        </tbody>
      </table>
    </div>
    
    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <footer>
    © 2025 Wallet System - Secure Financial Management
  </footer>

  <script src="script.js"></script>
  <script>
    loadUsers('balanceUserId');
  </script>
</body>
</html>
