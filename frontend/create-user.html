<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New User | Wallet System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/create-user.css">
</head>
<body>
  <header>
    <div class="header-content">
      <i class="fas fa-user-plus header-icon"></i>
      Create New User
    </div>
  </header>

  <div class="form-container">
    <div class="form-title">
      <i class="fas fa-user-circle"></i>
      Account Registration
    </div>
    
    <div class="input-group">
      <label for="name">Full Name</label>
      <i class="fas fa-user"></i>
      <input type="text" id="name" placeholder="Enter your full name">
    </div>
    
    <div class="input-group">
      <label for="email">Email Address</label>
      <i class="fas fa-envelope"></i>
      <input type="email" id="email" placeholder="Enter your email address">
    </div>
    
    <div class="input-group">
      <label for="password">Password</label>
      <i class="fas fa-lock"></i>
      <input type="password" id="password" placeholder="Create a strong password">
    </div>
    
    <div class="input-group">
      <label for="dob">Date of Birth</label>
      <i class="fas fa-calendar-alt"></i>
      <input type="date" id="dob">
    </div>
    
    <button onclick="createUser()">Sign Up <i class="fas fa-chevron-right"></i></button>
    
    <div id="userResult" class="result-message"></div>
    
    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <footer>
    © 2025 Wallet System - Secure Financial Management
  </footer>

  <script src="script.js"></script>
</body>
</html>
